name: Weekly Payments Newsletter

on:
  schedule:
    # Every Monday at 07:00 UTC (08:00 UK / 09:00 CEST)
    - cron: '0 7 * * 1'
  workflow_dispatch: # allow manual runs from the GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NewsBot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python NewsBot.py

      - name: Upload newsletter output
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_id }}
          path: GeneratedReports/
          retention-days: 30
