name: Weekly Payments Newsletter

on:
  schedule:
    # Every Monday at 07:00 UTC (08:00 UK / 09:00 CEST)
    - cron: '0 7 * * 1'
  workflow_dispatch: # allow manual runs from the GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NewsBot
        env:
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          # Option 1: Office 365 basic SMTP auth
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:        ${{ secrets.SMTP_PASSWORD }}
          # Option 2: Microsoft Graph API (preferred for MFA-enabled accounts)
          AZURE_TENANT_ID:      ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:      ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:  ${{ secrets.AZURE_CLIENT_SECRET }}
          MAIL_SENDER:          ${{ secrets.MAIL_SENDER }}
        run: python NewsBot.py

      - name: Upload newsletter output
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_id }}
          path: GeneratedReports/
          retention-days: 30
